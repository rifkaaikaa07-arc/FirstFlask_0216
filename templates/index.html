<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Form POST Flask</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="kotak">
    <h1>masukan nama</h1>

    <form method="post" action="{{ url_for('proses') }}">
      <label for="nama">Nama</label>
      <input type="text" id="nama" name="nama" placeholder="Tulis namamu" required>
      <button type="submit">Kirim</button>
    </form>

    {% if nama %}
    <p class="hasil">Halo, {{ nama }}!</p>
    {% endif %}
  </div>
</body>
</html>
